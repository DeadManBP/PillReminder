name: Build PillReminder APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          PILL_SIGNING_PASSWORD: ${{ secrets.PILL_SIGNING_PASSWORD }}
        run: |
          base64 -d signing/pill-release.keystore.enc.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PILL_SIGNING_PASSWORD -out "$RUNNER_TEMP/pill.keystore"
          test -s "$RUNNER_TEMP/pill.keystore"

      - name: Build debug APK
        env:
          PILL_KEYSTORE_FILE: ${{ runner.temp }}/pill.keystore
          PILL_KEYSTORE_PASSWORD: ${{ secrets.PILL_SIGNING_PASSWORD }}
          PILL_KEY_ALIAS: brockvillehub
          PILL_KEY_PASSWORD: ${{ secrets.PILL_SIGNING_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace -PpillVersionCode=${{ github.run_number }} -PpillVersionName=1.0.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PillReminder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pill Reminder Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
